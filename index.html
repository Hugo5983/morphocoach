<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MorphoCoach</title>
    <meta name="description" content="Coaching fitness personnalise selon votre morphologie." />
    <meta name="theme-color" content="#101318" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MorphoCoach" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ouvre la connexion vers le CDN photos pendant que l'app démarre -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <!-- moteurs de recherche produits : la connexion TLS est déjà ouverte
         quand l'utilisateur tape sa première recherche (~100-300 ms gagnées) -->
    <link rel="preconnect" href="https://search.openfoodfacts.org" crossorigin />
    <link rel="preconnect" href="https://fr.openfoodfacts.org" crossorigin />
    <link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { background: #101318; margin: 0; padding: 0; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Kill switch — un ancien service worker (sw.js, plus présent dans le
      // projet) peut être resté installé dans le navigateur et servir une
      // version en cache indéfiniment, même après un nouveau déploiement.
      // On le désinstalle et on vide le cache automatiquement, une fois.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    </script>
  </body>
</html>
